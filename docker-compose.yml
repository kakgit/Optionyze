services:
  app:
    build: .
    image: optionyze:latest
    restart: always
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.production

  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: optionyze
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: optionyze
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U optionyze -d optionyze"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
